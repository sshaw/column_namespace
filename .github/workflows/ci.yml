name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.rails }}.gemfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "2.7", rails: "5.2" }
          - { ruby: "2.7", rails: "6.0" }
          - { ruby: "3.1", rails: "7.0" }
          - { ruby: "3.2", rails: "7.1" }
          - { ruby: "3.3", rails: "7.2" }
          - { ruby: "3.3", rails: "8.0" }
          - { ruby: "4.0", rails: "8.0" }
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
